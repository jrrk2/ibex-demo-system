# Silicon memory-WRITE test over BSCANE2 (irlen 6) — forces progbuf memory
# access so the store is executed by the CPU's load_store_unit (the path the
# data_be byte-enable fix lives in).  sysbus would bypass the CPU and not
# exercise the fix.  Expect mdw to read back 0xdeadbeef (word write, all 4
# bytes) rather than 0x0800006f (johnson, write dropped).
adapter driver ftdi
transport select jtag
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0088 0x008b
ftdi tdo_sample_edge falling
reset_config none
jtag newtap riscv cpu -irlen 6 -expected-id 0x03687093 -ignore-version
target create riscv.cpu riscv -chain-position riscv.cpu
riscv set_ir idcode 0x09
riscv set_ir dtmcs 0x22
riscv set_ir dmi 0x23
riscv set_mem_access progbuf
gdb_port disabled
tcl_port disabled
telnet_port disabled
adapter speed 1000
riscv set_command_timeout_sec 20
init
halt
echo "=== pre-write readback ==="
mdw 0x00100000
echo "=== word write 0xdeadbeef via progbuf (CPU LSU) ==="
mww 0x00100000 0xdeadbeef
echo "=== post-write readback (expect 0xdeadbeef) ==="
mdw 0x00100000
echo "=== byte write test: 0xaa at +1 (expect 0xdeadaaef) ==="
mwb 0x00100001 0xaa
mdw 0x00100000
shutdown
