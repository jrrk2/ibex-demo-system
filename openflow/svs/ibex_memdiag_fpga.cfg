# Diagnostic: isolate where memory access breaks on silicon.
# Compares abstract register reads, sysbus mem access, and progbuf mem access.
adapter driver ftdi
transport select jtag
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0088 0x008b
ftdi tdo_sample_edge falling
reset_config none
jtag newtap riscv cpu -irlen 6 -expected-id 0x03687093 -ignore-version
target create riscv.cpu riscv -chain-position riscv.cpu
riscv set_ir idcode 0x09
riscv set_ir dtmcs 0x22
riscv set_ir dmi 0x23
gdb_port disabled
tcl_port disabled
telnet_port disabled
adapter speed 1000
riscv set_command_timeout_sec 20
init
halt
echo ">>> reg pc:"
reg pc
echo ">>> ---- SYSBUS read/write ----"
riscv set_mem_access sysbus
echo ">>> sysbus pre-read 0x00100000:"
mdw 0x00100000
echo ">>> sysbus write 0xdeadbeef:"
mww 0x00100000 0xdeadbeef
echo ">>> sysbus read-back:"
mdw 0x00100000
echo ">>> ---- PROGBUF read/write ----"
riscv set_mem_access progbuf
echo ">>> progbuf pre-read 0x00100004:"
mdw 0x00100004
echo ">>> progbuf write 0xcafef00d at 0x00100004:"
mww 0x00100004 0xcafef00d
echo ">>> progbuf read-back:"
mdw 0x00100004
shutdown
